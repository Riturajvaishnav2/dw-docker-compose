  ngrok:
    image: ngrok/ngrok:latest
    env_file: .env
    profiles:
      - ngrok
    depends_on:
      airflow-webserver:
        condition: service_started
      superset:
        condition: service_started
      trino:
        condition: service_started
      iceberg-rest:
        condition: service_started
      spark:
        condition: service_started
      swagger-ui:
        condition: service_started
      # opensearch and openmetadata-server are commented out above
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    volumes:
      - ./conf/ngrok/ngrok.yml:/etc/ngrok.yml
    command: start --all --config /etc/ngrok.yml
    ports:
      - "4041:4040"   # ngrok dashboard UI
    networks:
      - iceberg-net


networks:
  iceberg-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  airflow-dag-configs:
  # opensearch-data:      # unused while opensearch is commented out
  # openmetadata-volume:  # unused while openmetadata-server is commented out