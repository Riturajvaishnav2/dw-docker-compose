services:
  postgres:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/bootstrap/postgres-init.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - iceberg-net

  postgres-bootstrap:
    image: postgres:15
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
      SUPERSET_DB: ${SUPERSET_DB:-superset}
    entrypoint: ["/bin/bash", "/opt/scripts/bootstrap_postgres_databases.sh"]
    volumes:
      - ./scripts/bootstrap_postgres_databases.sh:/opt/scripts/bootstrap_postgres_databases.sh:ro
    networks:
      - iceberg-net

  # --- MinIO (local S3-compatible object storage for dev/test) ---
  minio:
    image: minio/minio:latest
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iceberg-net

  # --- Creates the buckets the platform expects on MinIO (idempotent) ---
  minio-init:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CATALOG_WAREHOUSE: ${CATALOG_WAREHOUSE:-warehouse}
      LANDING_BUCKET: ${LANDING_BUCKET:-landing}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$CATALOG_WAREHOUSE\" &&
      mc mb --ignore-existing local/\"$$LANDING_BUCKET\" &&
      echo 'MinIO buckets ready'
      "
    networks:
      - iceberg-net

  iceberg-rest:
    image: tabulario/iceberg-rest:0.6.0
    env_file: .env
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      AWS_REGION: ${OCI_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://${CATALOG_WAREHOUSE}
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_CHUNKED__ENCODING__ENABLED: "false"
      CATALOG_S3_CHECKSUM__ENABLED: "false"
      CATALOG_REST_CORS__ORIGINS: "*"
      CATALOG_REST_CORS__ALLOWED__METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CATALOG_REST_CORS__ALLOWED__HEADERS: "Content-Type,Authorization,X-Requested-With,ngrok-skip-browser-warning"
      CATALOG_REST_NESTED_NAMESPACE_ENABLED: "false"
      # Connection pool settings - optimized for remote S3
      CATALOG_JDBC_POOL_MIN-IDLE: "5"
      CATALOG_JDBC_POOL_MAX-IDLE: "15"
      CATALOG_JDBC_POOL_MAX-SIZE: "25"
      CATALOG_JDBC_POOL_CONNECTION-TIMEOUT: "10000"
      CATALOG_JDBC_POOL_IDLE-TIMEOUT: "300000"
      CATALOG_JDBC_POOL_MAX-LIFETIME: "540000"
      CATALOG_JDBC_POOL_KEEPALIVE-TIME: "60000"
      CATALOG_JDBC_POOL_VALIDATION-TIMEOUT: "3000"
      JAVA_TOOL_OPTIONS: >-
        -Dsoftware.amazon.awssdk.sdk.requestChecksumCalculation=WHEN_REQUIRED
        -Dsoftware.amazon.awssdk.sdk.responseChecksumCalculation=WHEN_REQUIRED
        -Dhttp.keepAlive=true
        -Dhttp.maxConnections=100
        -Dsoftware.amazon.awssdk.http.connection.read.timeout=30000
        -Dsoftware.amazon.awssdk.http.connection.write.timeout=30000
    ports:
      - "8181:8181"
    networks:
      - iceberg-net

  iceberg-alembic:
    build:
      context: .
      dockerfile: ./docker/iceberg-alembic/Dockerfile
    env_file: .env
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
    environment:
      ICEBERG_ALEMBIC_CATALOG_NAME: ${ICEBERG_NAMESPACE}
      ICEBERG_ALEMBIC_CATALOG_TYPE: rest
      ICEBERG_ALEMBIC_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_ALEMBIC_WAREHOUSE: s3://${CATALOG_WAREHOUSE}/${ICEBERG_NAMESPACE}
      ICEBERG_NAMESPACE: ${ICEBERG_NAMESPACE}
      ICEBERG_ALEMBIC_APPLIED_BY: ${ICEBERG_ALEMBIC_APPLIED_BY:-docker-compose}
      ICEBERG_ALEMBIC_STATE_PATH: /migrations/.iceberg-alembic-state.json
      ICEBERG_ALEMBIC_TRINO_URL: http://trino:8080
      ICEBERG_ALEMBIC_SPARK_URL: sc://spark:15002
      ICEBERG_ALEMBIC_PROPERTY_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      ICEBERG_ALEMBIC_PROPERTY_S3_REGION: ${OCI_REGION}
      ICEBERG_ALEMBIC_PROPERTY_S3_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      ICEBERG_ALEMBIC_PROPERTY_S3_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      ICEBERG_ALEMBIC_PROPERTY_S3_PATH_STYLE_ACCESS: "true"
      ICEBERG_ALEMBIC_PROPERTY_S3_CHECKSUM_ENABLED: "false"
      ICEBERG_ALEMBIC_PROPERTY_S3_CHUNKED_ENCODING_ENABLED: "false"
      # Set to "true" to fix migrations on startup, "false" to skip
      MIGRATION_FIX: "true"
    volumes:
      - ./iceberg-alembic/migrations:/migrations/migrations
      - ./scripts:/opt/project/scripts
      - ./conf/trino/catalog:/opt/project/conf/trino/catalog
    healthcheck:
      test: ["CMD", "python", "/verify_migrations.py"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - iceberg-net

  spark:
    build:
      context: ./docker/spark
    env_file: .env
    depends_on:
      iceberg-rest:
        condition: service_started
      iceberg-alembic:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      AWS_REGION: ${OCI_REGION:-us-east-1}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      USE_OCI_STORAGE: ${USE_OCI_STORAGE:-false}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      CATALOG_WAREHOUSE: s3://${CATALOG_WAREHOUSE}
    command: [ "/bin/bash", "-lc", "python -c 'from pyspark.sql import SparkSession; spark = SparkSession.builder.appName(\"SparkUI\").master(\"local[*]\").getOrCreate(); import time; time.sleep(999999)'" ]
    volumes:
      - ./jobs:/opt/platform/jobs
      - ./data:/opt/platform/data
      - ./conf/spark:/opt/platform/conf/spark
    ports:
      - "4040:4040"
    networks:
      - iceberg-net

  trino:
    image: trinodb/trino:480
    env_file: .env
    depends_on:
      iceberg-rest:
        condition: service_started
      iceberg-alembic:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ui/api.html"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6g
        reservations:
          cpus: '0.5'
          memory: 2g
    environment:
      AWS_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      OCI_REGION: ${OCI_REGION:-us-east-1}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
    extra_hosts:
      - "${SSO_HOST}:${SSO_HOST_IP}"
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog
      - ./conf/trino/config.properties:/etc/trino/config.properties
      - ./conf/trino/password.db:/etc/trino/password.db
      - ./conf/trino/password-authenticator.properties:/etc/trino/password-authenticator.properties
      - ./conf/trino/keystore.p12:/etc/trino/keystore.p12:ro
      - ./conf/trino/jvm.config:/etc/trino/jvm.config:ro
    ports:
      - "8443:8443"
    networks:
      - iceberg-net

  airflow-init:
    build:
      context: ./docker/airflow
    env_file: .env
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
      iceberg-alembic:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      AWS_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      AWS_REGION: ${OCI_REGION:-us-east-1}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      OCI_REGION: ${OCI_REGION:-uk-london-1}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      USE_OCI_STORAGE: ${USE_OCI_STORAGE:-false}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    user: "${AIRFLOW_UID}:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./data:/opt/airflow/data
      - ./conf/spark:/opt/airflow/conf/spark
      - airflow-logs:/opt/airflow/logs
      - ./scripts/bootstrap_ingestion_prefixes.sh:/bootstrap_ingestion_prefixes.sh:ro
      - ./scripts:/opt/scripts
    entrypoint: >
      /bin/bash -c " airflow db migrate && airflow users create --role Admin --username ${AIRFLOW_USER} --password ${AIRFLOW_PASSWORD} --firstname Local --lastname Admin --email admin@example.com || true &&
      /opt/scripts/bootstrap_ingestion_prefixes.sh &&
      /opt/scripts/upload_to_oracle_s3.sh"
    networks:
      - iceberg-net

  airflow-webserver:
    build:
      context: ./docker/airflow
    env_file: .env
    depends_on:
      - airflow-init
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6g
        reservations:
          cpus: '0.5'
          memory: 2g
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth"
      AWS_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      AWS_REGION: ${OCI_REGION:-us-east-1}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      OCI_REGION: ${OCI_REGION:-uk-london-1}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      USE_OCI_STORAGE: ${USE_OCI_STORAGE:-false}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      AIRFLOW_UID: ${AIRFLOW_UID}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      AIRFLOW__WEBSERVER__BASE_URL: "${HTTP_SCHEME}://${AIRFLOW}"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
      AIRFLOW__WEBSERVER__PROXY_FIX_X_FOR: "1"
      AIRFLOW__WEBSERVER__PROXY_FIX_X_PROTO: "1"
      AIRFLOW__WEBSERVER__PROXY_FIX_X_HOST: "1"
      AIRFLOW__WEBSERVER__PROXY_FIX_X_PREFIX: "1"
      LANDING_BUCKET: ${LANDING_BUCKET:-landing}
    user: "${AIRFLOW_UID}:0"
    command: webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./data:/opt/airflow/data
      - ./conf/spark:/opt/airflow/conf/spark
      - airflow-logs:/opt/airflow/logs
      - airflow-dag-configs:/opt/airflow/dag_generated_configs
      - ./conf/airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    ports:
      - "8080:8080"
    networks:
      - iceberg-net

  airflow-scheduler:
    build:
      context: ./docker/airflow
    env_file: .env
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      AWS_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      AWS_REGION: ${OCI_REGION:-us-east-1}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      OCI_REGION: ${OCI_REGION:-uk-london-1}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT}
      USE_OCI_STORAGE: ${USE_OCI_STORAGE:-false}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      AIRFLOW_UID: ${AIRFLOW_UID}
    user: "${AIRFLOW_UID}:0"
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./data:/opt/airflow/data
      - ./conf/spark:/opt/airflow/conf/spark
      - airflow-logs:/opt/airflow/logs
      - airflow-dag-configs:/opt/airflow/dag_generated_configs
    networks:
      - iceberg-net

  superset:
    build:
      context: ./docker/superset
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
      iceberg-alembic:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme}
      SUPERSET_DB_URI: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${SUPERSET_DB}"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_TRINO_DB_NAME: ${SUPERSET_TRINO_DB_NAME:-DataWarehouse}
      SUPERSET_TRINO_DB_URI: ${SUPERSET_TRINO_DB_URI:-trino://admin:admin@trino:8443/iceberg?verify=false}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      SUPERSET_PUBLIC_URL: ${HTTP_SCHEME}://${SUPERSET}
    volumes:
      - ./conf/superset:/app/pythonpath
    ports:
      - "8088:8088"
    command: >
      /bin/sh -c " echo 'Waiting for database...' && until superset db upgrade; do echo 'DB upgrade not ready, retrying in 5s...'; sleep 5; done && superset fab create-admin --username $${SUPERSET_ADMIN_USER:-admin} --firstname Superset --lastname Admin --email $${SUPERSET_ADMIN_EMAIL:-admin@example.com} --password $${SUPERSET_ADMIN_PASSWORD:-admin} || true && superset init && python /app/pythonpath/bootstrap_trino_database.py && superset run -p 8088 --with-threads --reload --host 0.0.0.0 "
    networks:
      - iceberg-net

  iceberg-rest-proxy:
    image: nginx:alpine
    depends_on:
      - iceberg-rest
    volumes:
      - ./conf/nginx/iceberg-cors-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8182:8182"
    networks:
      - iceberg-net

  swagger-ui:
    image: swaggerapi/swagger-ui
    depends_on:
      - iceberg-rest
    environment:
      SWAGGER_JSON: /openapi/iceberg-rest-catalog.yaml
    volumes:
      - ./conf/swagger/iceberg-rest-catalog.yaml:/openapi/iceberg-rest-catalog.yaml:ro
    ports:
      - "8282:8080"
    networks:
      - iceberg-net

