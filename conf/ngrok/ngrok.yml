version: "2"
tunnels:
  airflow:
    proto: http
    addr: airflow-webserver:8080
    domain: airflow.ngrok-free.app
    inspect: false
  superset:
    proto: http
    addr: superset:8088
    domain: superset.ngrok-free.app
    inspect: false
  trino:
    proto: http
    addr: trino:8080
    domain: trino.ngrok-free.app
    inspect: false
  iceberg-rest:
    proto: http
    addr: iceberg-rest-proxy:8182
    domain: iceberg.ngrok-free.app
    inspect: false
  spark:
    proto: http
    addr: spark:4040
    inspect: false
  swagger-ui:
    proto: http
    addr: swagger-ui:8080
    domain: swagger.ngrok-free.app
    inspect: false
  # opensearch and openmetadata tunnels removed — those services are
  # commented out in docker-compose.yml
