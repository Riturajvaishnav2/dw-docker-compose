coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/keystore.p12
http-server.https.keystore.key=trinossl
discovery.uri=http://localhost:8080
http-server.process-forwarded=true
# PASSWORD kept for JDBC connections; OAUTH2 secures the web UI
http-server.authentication.type=PASSWORD,OAUTH2
http-server.authentication.allow-insecure-over-http=true
internal-communication.shared-secret=bf8cf0edfc97f6cb04e352ecc843dc76359370b24276417af08a8dcf860f8eee
web-ui.authentication.type=OAUTH2
http-server.authentication.oauth2.issuer=${ENV:KEYCLOAK_REALM_URL}
http-server.authentication.oauth2.client-id=${ENV:OAUTH_CLIENT_ID}
http-server.authentication.oauth2.client-secret=${ENV:OAUTH_CLIENT_SECRET}
http-server.authentication.oauth2.scopes=openid,profile,email
http-server.authentication.oauth2.principal-field=email